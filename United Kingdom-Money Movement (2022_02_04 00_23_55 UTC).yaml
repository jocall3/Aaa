// --- API Client (SDK) ---
export class MoneyMovementAPI {
  private baseURL: string;
  private client_id: string;

  constructor(baseURL: string, client_id: string) {
    this.baseURL = baseURL;
    this.client_id = client_id;
  }

  private async request<T>(
    method: 'GET' | 'POST' | 'PUT' | 'DELETE',
    path: string,
    accessToken: string,
    uuid: string,
    body?: any,
    queryParams?: Record<string, any>
  ): Promise<T> {
    const headers = {
      Authorization: `Bearer ${accessToken}`,
      uuid: uuid,
      Accept: 'application/json',
      client_id: this.client_id,
      'Content-Type': 'application/json',
    };

    const url = new URL(`${this.baseURL}${path}`);
    if (queryParams) {
      Object.keys(queryParams).forEach(key => url.searchParams.append(key, queryParams[key]));
    }

    try {
      const response = await axios({
        method,
        url: url.toString(),
        headers,
        data: body,
      });
      return response.data;
    } catch (error: any) {
      if (axios.isAxiosError(error) && error.response) {
        console.error(`API Error: ${error.response.status} - ${JSON.stringify(error.response.data)}`);
        throw new Error(JSON.stringify(error.response.data));
      }
      console.error(`Network or unexpected error: ${error.message}`);
      throw error;
    }
  }

  // Gemini Integration Helper (Conceptual: to analyze/generate payment details)
  private async callGemini(prompt: string, context: any): Promise<string> {
    try {
      // In a real scenario, this would be a more sophisticated prompt engineering.
      // For now, it's a simple text completion with context.
      const fullPrompt = `Analyze the following banking context and provide a concise summary or relevant data points: ${JSON.stringify(context)}. User request: ${prompt}`;
      const response = await geminiApi.createCompletion({
        model: 'text-davinci-003', // Replace with an actual Gemini model if available via OpenAI API, or use a native Gemini SDK
        prompt: fullPrompt,
        max_tokens: 150,
      });
      return response.data.choices[0].text || 'No Gemini response.';
    } catch (error: any) {
      console.error("Gemini API error:", error.response ? error.response.data : error.message);
      return `Gemini analysis failed: ${error.message}`;
    }
  }

  // --- SDK Methods for Endpoints ---

  // Retrieve the status of all transactions executed in one bundle
  public async retrievePaymentInitiationTransactionMultipleTransfersStatus(
    accessToken: string,
    uuid: string,
    citiBundleId: string,
    startIndex?: string,
    clientDetails?: string
  ): Promise<RetrievePaymentInitiationTransactionMultipleTransfersStatusResponse> {
    const path = `/v1/paymentInitiation/multipleTransfers/${citiBundleId}/status`;
    const headers = {
      Authorization: `Bearer ${accessToken}`,
      uuid: uuid,
      Accept: 'application/json',
      client_id: this.client_id,
      ...(clientDetails && { clientDetails }),
    };
    const queryParams = { startIndex };
    const response = await this.request<RetrievePaymentInitiationTransactionMultipleTransfersStatusResponse>(
      'GET', path, accessToken, uuid, undefined, queryParams
    );
    // Integrate Gemini: Analyze transaction status
    const geminiAnalysis = await this.callGemini(
      "Summarize the status of these multiple transfers.",
      { citiBundleId, status: response.transactionDetails?.map(t => t.transactionStatus) }
    );
    console.log(`Gemini analysis for multiple transfers status (${citiBundleId}): ${geminiAnalysis}`);
    return response;
  }

  // Retrieve unmasked account number for the requested account Id
  public async retrieveUnmaskedAccountData(
    accessToken: string,
    uuid: string,
    body: RetrieveUnmaskedAccountDataRequest,
    clientDetails?: string
  ): Promise<RetrieveUnmaskedAccountDataResponse> {
    const path = '/v1/accounts/clearData/retrieve';
    const headers = {
      Authorization: `Bearer ${accessToken}`,
      uuid: uuid,
      Accept: 'application/json',
      client_id: this.client_id,
      'Content-Type': 'application/json',
      ...(clientDetails && { clientDetails }),
    };
    const response = await this.request<RetrieveUnmaskedAccountDataResponse>(
      'POST', path, accessToken, uuid, body
    );
    const geminiAnalysis = await this.callGemini(
      "Extract unmasked account numbers.",
      { request: body, response: response.accounts?.map(a => ({ id: a.accountId, unmasked: a.unmaskedAccountNumber })) }
    );
    console.log(`Gemini analysis for unmasked account data: ${geminiAnalysis}`);
    return response;
  }

