        - live_mode
        - metadata
        - object
        - reconciliation_method
        - remittance_information
        - statement_descriptor
        - status
        - transaction_id
        - transaction_line_item_id
        - type
        - updated_at
      type: object
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
        live_mode:
          type: boolean
          description: >-
            This field will be true if this object exists in the live
            environment or false if it exists in the test environment.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        amount_upper_bound:
          type: integer
          description: >-
            The highest amount this expected payment may be equal to. Value in
            specified currency's smallest unit. e.g. $10 would be represented as
            1000.
        amount_lower_bound:
          type: integer
          description: >-
            The lowest amount this expected payment may be equal to. Value in
            specified currency's smallest unit. e.g. $10 would be represented as
            1000.
        direction:
          type: string
          description: >-
            One of credit or debit. When you are receiving money, use credit.
            When you are being charged, use debit.
          enum:
            - credit
            - debit
        internal_account_id:
          type: string
          description: The ID of the Internal Account for the expected payment.
          format: uuid
        type:
          type: string
          description: >-
            One of: ach, au_becs, bacs, book, check, eft, interac, provxchange,
            rtp, sen, sepa, signet, wire.
          nullable: true
          enum:
            - ach
            - au_becs
            - bacs
            - book
            - card
            - check
            - cross_border
            - eft
            - interac
            - masav
            - neft
            - provxchange
            - rtp
            - sen
            - sepa
            - signet
            - wire
        currency:
          $ref: '#/components/schemas/currency'
        date_upper_bound:
          type: string
          description: 'The latest date the payment may come in. Format: yyyy-mm-dd'
          format: date
          nullable: true
        date_lower_bound:
          type: string
          description: 'The earliest date the payment may come in. Format: yyyy-mm-dd'
          format: date
          nullable: true
        description:
          type: string
          description: An optional description for internal use.
          nullable: true
        statement_descriptor:
          type: string
          description: >-
            The statement description you expect to see on the transaction. For
            ACH payments, this will be the full line item passed from the bank.
            For wire payments, this will be the OBI field on the wire. For check
            payments, this will be the memo field.
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          description: >-
            Additional data represented as key-value pairs. Both the key and
            value must be strings.
          example:
            key: value
            foo: bar
            modern: treasury
        counterparty_id:
          type: string
          description: The ID of the counterparty you expect for this payment.
          format: uuid
          nullable: true
        remittance_information:
          type: string
          description: >-
            For `ach`, this field will be passed through on an addenda record.
            For `wire` payments the field will be passed through as the
            "Originator to Beneficiary Information", also known as OBI or
            Fedwire tag 6000.
          nullable: true
        transaction_id:
          type: string
          description: >-
            The ID of the Transaction this expected payment object has been
            matched to.
          format: uuid
          nullable: true
        transaction_line_item_id:
          type: string
          description: >-
            The ID of the Transaction Line Item this expected payment has been
            matched to.
          format: uuid
          nullable: true
        status:
          type: string
          description: One of unreconciled, reconciled, or archived.
          enum:
            - archived
            - reconciled
            - unreconciled
        reconciliation_method:
          type: string
          description: >-
            One of manual if this expected payment was manually reconciled in
            the dashboard, automatic if it was automatically reconciled by
            Modern Treasury, or null if it is unreconciled.
          nullable: true
          enum:
            - automatic
            - manual
        ledger_transaction_id:
          type: string
          description: The ID of the ledger transaction linked to the expected payment.
          format: uuid
          nullable: true
      additionalProperties: false
