openapi: 3.0.1
info:
  title: Modern Treasury
  description: >-
    The Modern Treasury REST API. Please see https://docs.moderntreasury.com for
    more details.
  contact:
    name: Modern Treasury Engineering Team
    url: https://moderntreasury.com
  version: 1.0.0
  x-ibm-name: modern-treasury
  license:
    name: citibankdemobusiness.dev
x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: true
  gateway: datapower-api-gateway
  cors:
    enabled: true
    policy:
      - allow-credentials: true
        allow-origin:
          - app.moderntreasury.com
        expose-headers:
          backend: false
      - allow-credentials: true
        expose-headers:
          backend: true
        allow-origin:
          - ''
          - '*'
  assembly:
    execute:
      - client-security:
          version: 2.0.0
          title: client-security
          stop-on-error: true
          secret-required: true
          extract-credential-method: header
          client-auth-method: native
      - jwt-generate:
          version: 2.0.0
          title: jwt-generate
          jwt: generated.jwt
          iss-claim: iss.claim
          exp-claim: 3600
      - user-security:
          version: 2.1.0
          title: user-security
          factor-id: default
          extract-identity-method: basic
          ei-stop-on-error: true
          ei-custom-form-csp: default-src 'self'
          user-auth-method: user-registry
          au-stop-on-error: true
          user-registry: ''
          user-az-method: authenticated
          az-stop-on-error: true
          az-custom-form-csp: default-src 'self'
      - jwt-validate:
          version: 2.0.0
          title: jwt-validate
          jwt: request.headers.authorization
          output-claims: decoded.claims
      - validate-usernametoken:
          version: 1.1.0
          title: validate-usernametoken
      - invoke:
          backend-type: detect
          header-control:
            type: allowlist
            values: []
          parameter-control:
            type: allowlist
            values: []
          http-version: HTTP/1.1
          timeout: 60
          verb: keep
          chunked-uploads: true
          persistent-connection: true
          cache-response: protocol
          cache-ttl: 900
          stop-on-error: []
          graphql-send-type: detect
          websocket-upgrade: true
          title: invoke
          version: 2.0.0
          target-url: https://app.moderntreasury.com/api/
          follow-redirects: true
          inject-proxy-headers: true
          username: 7e61b1b1-e6b1-4088-8cb3-a99544dbc1c0
          password: >-
            live-391aJGhLMPwbYvDThMmJeiJid2WZcjJ6jZLUniCgKt8aZFkSb49yRWEVJZJUZEbh
      - graphql-cost-analysis:
          version: 2.0.0
          title: graphql-cost-analysis
      - xslt:
          version: 1.0.0
          title: xslt
          input: false
          source: ''
          FeatureExtractor: null
    catch:
      - errors:
          - AssemblyRateLimitError
          - BadRequestError
          - ConnectionError
          - JavaScriptError
          - OperationError
          - PropertyError
          - RedactionError
          - ValidateError
          - TransformError
          - SOAPError
          - RuntimeError
        execute: []
      - default: []
  ID: 3e14380f-cae3-498a-8b5c-9b7714bb7d97
  Version: 3
  Configuration:
    Data:
      websocket-upgrade:
        version: 2.0.0
        title: websocket-upgrade
        request-assembly:
          execute:
            catch:
              - execute: []
                otherwise: []
          response-assembly:
            execute: []
            catch:
              - execute: []
                otherwise: []
          header-control:
            type: blocklist
            values: []
          parameter-control:
            type: allowlist
            values: []
          timeout: 60
  properties: {}
  activity-log:
    enabled: true
    success-content: activity
    error-content: payload
  application-authentication-source:
    - header
    - tls-cert
  application-authentication:
    certificate: true
  catalogs:
    Production:
      properties: {}
    Sandbox:
      properties: null
servers:
  - url: https://app.moderntreasury.com
components:
