# infra/k8s/base/redis.deployment.yaml
#
# Part of the Elite AI Implementation Team's architectural transformation.
# This manifest defines the Kubernetes Deployment and Service for a Redis instance,
# which serves as the distributed cache for the microservices platform.
#
# Architectural Directive: Establish a Multi-Layer Caching Strategy.
# This Redis instance provides a shared, high-performance, in-memory data store
# for caching at both the BFF and microservice layers. It is crucial for
# reducing latency, offloading databases, and improving overall system resilience.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  labels:
    app.kubernetes.io/name: redis-cache
    app.kubernetes.io/component: cache
    tier: backing-service
spec:
  replicas: 1 # In production overlays, this should be scaled up for HA (e.g., using Redis Sentinel or Cluster).
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-cache
        app.kubernetes.io/component: cache
        tier: backing-service
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
          name: redis-port
        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  labels:
    app.kubernetes.io/name: redis-cache
    app.kubernetes.io/component: cache
    tier: backing-service
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: redis-port
    protocol: TCP
  selector:
    app.kubernetes.io/name: redis-cache
