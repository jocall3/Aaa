              $ref: '#/components/schemas/transaction_update_request'
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transaction'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
      security:
        - basic_auth: []
  /api/validations/routing_numbers:
    get:
      tags:
        - Validation
      summary: validate routing numbers
      description: >-
        Validates the routing number information supplied without creating a
        routing detail
      operationId: validateRoutingNumber
      parameters:
        - name: routing_number
          in: query
          description: The routing number that is being validated.
          required: true
          style: form
          explode: true
          schema:
            type: string
        - name: routing_number_type
          in: query
          description: >-
            One of `aba`, `au_bsb`, `br_codigo`, `ca_cpa`, `cnaps`,
            `gb_sort_code`, `in_ifsc`, `my_branch_code`, or `swift`. In sandbox
            mode we currently only support `aba` and `swift` with routing
            numbers '123456789' and 'GRINUST0XXX' respectively.
          required: true
          style: form
          explode: true
          schema:
            type: string
            enum:
              - aba
              - au_bsb
              - br_codigo
              - ca_cpa
              - cnaps
              - gb_sort_code
              - in_ifsc
              - my_branch_code
              - swift
      responses:
        '200':
          description: successful valid routing number and type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/routing_number_lookup_request'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
        '422':
          description: unsuccessful with invalid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
      security:
        - basic_auth: []
  /api/virtual_accounts:
    get:
      tags:
        - VirtualAccount
      summary: list virtual_accounts
      description: Get a list of virtual accounts.
      operationId: listVirtualAccounts
      parameters:
        - name: after_cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            nullable: true
        - name: per_page
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
        - name: internal_account_id
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            format: uuid
        - name: counterparty_id
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            format: uuid
        - name: metadata
          in: query
          description: >-
            For example, if you want to query for records with metadata key
            `Type` and value `Loan`, the query would be
            `metadata%5BType%5D=Loan`. This encodes the query parameters.
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        '200':
          description: successful
          headers:
            X-After-Cursor:
              description: >-
                The cursor for the next page. Including this in a call as
                `after_cursor` will return the next page.
              style: simple
              explode: false
              schema:
                type: string
                nullable: true
            X-Per-Page:
              description: The current `per_page`.
              style: simple
              explode: false
              schema:
                type: integer
                nullable: true
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/virtual_account'
        '401':
          description: unsuccessful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
      security:
        - basic_auth: []
    post:
      tags:
        - VirtualAccount
      summary: create virtual_account
      operationId: createVirtualAccount
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            This key should be something unique, preferably something like an
            UUID.
          required: false
          style: simple
          explode: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/virtual_account_create_request'
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/virtual_account'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
        '422':
          description: unsuccessful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
      security:
        - basic_auth: []
  /api/virtual_accounts/{id}:
    get:
      tags:
        - VirtualAccount
      summary: get virtual_account
      operationId: getVirtualAccount
      parameters:
        - name: id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
      responses:
        '200':
          description: successful
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_message'
      security:
        - basic_auth: []
    delete:
      tags:
        - VirtualAccount
      summary: delete virtual_account
      operationId: deleteVirtualAccount
      parameters:
        - name: id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/virtual_account'
      security:
        - basic_auth: []
    patch:
      tags:
        - VirtualAccount
      summary: update virtual_account
      operationId: updateVirtualAccount
      parameters:
        - name: id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/virtual_account_update_request'
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/virtual_account'
      security: null
  schemas:
    accounting:
      type: object
      properties:
        account_id:
          type: string
          description: >-
            The ID of one of your accounting categories. Note that these will
            only be accessible if your accounting system has been connected.
          format: uuid
          nullable: true
        class_id:
          type: string
          description: >-
            The ID of one of the class objects in your accounting system. Class
            objects track segments of your business independent of client or
            project. Note that these will only be accessible if your accounting
            system has been connected.
          format: uuid
          nullable: true
    account_detail:
      maxProperties: 9
      minProperties: 8
      required:
        - account_number_safe
        - account_number_type
        - created_at
        - discarded_at
        - id
        - live_mode
        - object
        - updated_at
      type: object
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
        live_mode:
          type: boolean
          description: >-
            This field will be true if this object exists in the live
            environment or false if it exists in the test environment.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        discarded_at:
          type: string
          format: date-time
          nullable: true
        account_number:
          type: string
          description: The account number for the bank account.
        account_number_type:
          type: string
          description: >-
            One of `iban`, `clabe`, `wallet_address`, or `other`. Use `other` if
            the bank account number is in a generic format.
          enum:
            - clabe
            - iban
            - other
            - pan
            - wallet_address
        account_number_safe:
          type: string
          description: The last 4 digits of the account_number.
      additionalProperties: false
    account_detail_create_request:
      required:
        - account_number
      type: object
      properties:
        account_number:
          type: string
          description: The account number for the bank account.
        account_number_type:
          type: string
          description: >-
            One of `iban`, `clabe`, `wallet_address`, or `other`. Use `other` if
            the bank account number is in a generic format.
          enum:
            - clabe
            - iban
            - other
            - pan
            - wallet_address
    address:
      minProperties: 11
      required:
        - country
        - created_at
        - id
        - line1
        - line2
        - live_mode
        - locality
        - object
        - postal_code
        - region
        - updated_at
      type: object
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
        live_mode:
          type: boolean
          description: >-
            This field will be true if this object exists in the live
            environment or false if it exists in the test environment.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        line1:
          type: string
          nullable: true
        line2:
          type: string
          nullable: true
        locality:
          type: string
          description: Locality or City.
          nullable: true
        region:
          type: string
          description: Region or State.
          nullable: true
        postal_code:
          type: string
          description: The postal code of the address.
          nullable: true
        country:
          type: string
          description: Country code conforms to [ISO 3166-1 alpha-2]
          nullable: true
      additionalProperties: false
      nullable: true
    address_request:
      type: object
      properties:
        line1:
          type: string
          nullable: true
        line2:
          type: string
          nullable: true
        locality:
          type: string
          description: Locality or City.
          nullable: true
        region:
          type: string
          description: Region or State.
          nullable: true
        postal_code:
          type: string
          description: The postal code of the address.
          nullable: true
        country:
          type: string
          description: Country code conforms to [ISO 3166-1 alpha-2]
          nullable: true
    async_response:
      minProperties: 2
      required:
        - id
        - object
      type: object
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
      additionalProperties: false
    balance_report:
      minProperties: 10
      required:
        - as_of_date
        - as_of_time
        - balance_report_type
        - balances
        - created_at
        - id
        - internal_account_id
        - live_mode
        - object
        - updated_at
      type: object
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
        live_mode:
          type: boolean
          description: >-
            This field will be true if this object exists in the live
            environment or false if it exists in the test environment.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        balance_report_type:
          type: string
          description: >-
            The specific type of balance report. One of `intraday`,
            `previous_day`, `real_time`, or `other`.
          enum:
            - intraday
            - other
            - previous_day
            - real_time
        as_of_date:
          type: string
          description: The date of the balance report in local time.
          format: date
        as_of_time:
          type: string
          description: The time (24-hour clock) of the balance report in local time.
          format: time
          nullable: true
        balances:
          type: array
          description: An array of `Balance` objects.
          items:
            $ref: '#/components/schemas/balance'
        internal_account_id:
          type: string
          description: The ID of one of your organization's Internal Accounts.
          format: uuid
      additionalProperties: false
    balance:
      minProperties: 10
      required:
        - amount
        - balance_type
        - created_at
        - currency
        - id
        - live_mode
        - object
        - updated_at
        - vendor_code
        - vendor_code_type
      type: object
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
        live_mode:
          type: boolean
          description: >-
            This field will be true if this object exists in the live
            environment or false if it exists in the test environment.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        amount:
          type: integer
          description: The balance amount.
        currency:
          $ref: '#/components/schemas/currency'
        balance_type:
          type: string
          description: >-
            The specific type of balance reported. One of `opening_ledger`,
            `closing_ledger`, `current_ledger`, `opening_available`,
            `opening_available_next_business_day`, `closing_available`,
            `current_available`, or `other`.
          enum:
            - closing_available
            - closing_ledger
            - current_available
            - current_ledger
            - opening_available
            - opening_available_next_business_day
            - opening_ledger
            - other
        vendor_code:
          type: string
          description: The code used by the bank when reporting this specific balance.
        vendor_code_type:
          type: string
          description: The code used by the bank when reporting this specific balance.
          nullable: true
          enum:
            - bai2
            - bankprov
            - bnk_dev
            - cleartouch
            - cross_river
            - currencycloud
            - dc_bank
            - dwolla
            - evolve
            - goldman_sachs
            - iso20022
            - jpmc
            - mx
            - signet
            - silvergate
            - swift
            - us_bank
      additionalProperties: false
    connection:
      minProperties: 9
      required:
        - created_at
        - discarded_at
        - id
        - live_mode
        - object
        - updated_at
        - vendor_customer_id
        - vendor_id
        - vendor_name
      type: object
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
        live_mode:
          type: boolean
          description: >-
            This field will be true if this object exists in the live
            environment or false if it exists in the test environment.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        discarded_at:
          type: string
          format: date-time
          nullable: true
        vendor_id:
          type: string
          description: Unique identifier for the bank or vendor.
          format: uuid
        vendor_customer_id:
          type: string
          description: An identifier given to this connection by the bank.
          format: uuid
          nullable: true
        vendor_name:
          type: string
          description: A human-friendly name for the bank or vendor.
      additionalProperties: false
    contact_detail:
      minProperties: 8
      required:
        - contact_identifier
        - contact_identifier_type
        - created_at
        - discarded_at
        - id
        - live_mode
        - object
        - updated_at
      type: object
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
        live_mode:
          type: boolean
          description: >-
            This field will be true if this object exists in the live
            environment or false if it exists in the test environment.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        discarded_at:
          type: string
          format: date-time
          nullable: true
        contact_identifier:
          type: string
        contact_identifier_type:
          type: string
          enum:
            - email
            - phone_number
            - website
      additionalProperties: false
    contact_detail_create_request:
      type: object
      properties:
        contact_identifier:
          type: string
        contact_identifier_type:
          type: string
          enum:
            - email
            - phone_number
            - website
    counterparty:
      minProperties: 11
      required:
        - accounts
        - created_at
        - discarded_at
        - email
        - id
        - live_mode
        - metadata
        - name
        - object
        - send_remittance_advice
        - updated_at
      type: object
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
        live_mode:
          type: boolean
          description: >-
            This field will be true if this object exists in the live
            environment or false if it exists in the test environment.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        discarded_at:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          description: A human friendly name for this counterparty.
          nullable: true
        accounts:
          type: array
          description: The accounts for this counterparty.
          items:
            $ref: '#/components/schemas/counterparty_accounts'
        email:
          type: string
          description: The counterparty's email.
          format: email
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          description: >-
            Additional data represented as key-value pairs. Both the key and
            value must be strings.
          example:
            key: value
            foo: bar
            modern: treasury
        send_remittance_advice:
          type: boolean
          description: >-
            Send an email to the counterparty whenever an associated payment
            order is sent to the bank.
      additionalProperties: false
    counterparty_collect_account_request:
      required:
        - direction
      type: object
      properties:
        direction:
          type: string
          description: >-
            One of `credit` or `debit`. Use `credit` when you want to pay a
            counterparty. Use `debit` when you need to charge a counterparty.
            This field helps us send a more tailored email to your
            counterparties."
          enum:
            - credit
            - debit
        send_email:
          type: boolean
          description: >-
            By default, Modern Treasury will send an email to your counterparty
            that includes a link to the form they must fill out. However, if you
            would like to send the counterparty the link, you can set this
            parameter to `false`. The JSON body will include the link to the
            secure Modern Treasury form.
        fields:
          type: array
          description: >-
            The list of fields you want on the form. This field is optional and
            if it is not set, will default to [\"nameOnAccount\",
            \"accountType\", \"accountNumber\", \"routingNumber\", \"address\"].
            The full list of options is [\"name\", \"nameOnAccount\",
            \"taxpayerIdentifier\", \"accountType\", \"accountNumber\",
            \"routingNumber\", \"address\", \"ibanNumber\", \"swiftCode\"].
          items:
            type: string
            enum:
              - name
              - nameOnAccount
              - taxpayerIdentifier
              - accountType
              - accountNumber
              - ibanNumber
              - clabeNumber
              - walletAddress
              - panNumber
              - routingNumber
              - abaWireRoutingNumber
              - swiftCode
              - auBsb
              - caCpa
              - cnaps
              - gbSortCode
              - inIfsc
              - myBranchCode
              - brCodigo
              - routingNumberType
              - address
        custom_redirect:
          type: string
          description: >-
            The URL you want your customer to visit upon filling out the form.
            By default, they will be sent to a Modern Treasury landing page.
            This must be a valid HTTPS URL if set.
          format: uri
    counterparty_collect_account_response:
      minProperties: 3
      required:
        - form_link
        - id
        - is_resend
      type: object
      properties:
        id:
          type: string
          description: The id of the existing counterparty.
        is_resend:
          type: boolean
          description: >-
            This field will be `true` if an email requesting account details has
            already been sent to this counterparty.
        form_link:
          type: string
          description: >-
            This is the link to the secure Modern Treasury form. By default,
            Modern Treasury will send an email to your counterparty that
            includes a link to this form. However, if `send_email` is passed as
            `false` in the body then Modern Treasury will not send the email and
            you can send it to the counterparty directly.
          format: uri
      additionalProperties: false
    counterparty_create_request:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: A human friendly name for this counterparty.
          nullable: true
        accounts:
          type: array
          description: The accounts for this counterparty.
          items:
            $ref: '#/components/schemas/counterparty_create_request_accounts'
        email:
          type: string
          description: The counterparty's email.
          format: email
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          description: >-
            Additional data represented as key-value pairs. Both the key and
            value must be strings.
          example:
            key: value
            foo: bar
            modern: treasury
        send_remittance_advice:
          type: boolean
          description: >-
            Send an email to the counterparty whenever an associated payment
            order is sent to the bank.
        accounting:
          $ref: '#/components/schemas/counterparty_create_request_accounting'
        ledger_type:
          type: string
          description: >-
            An optional type to auto-sync the counterparty to your ledger.
            Either `customer` or `vendor`.
          deprecated: true
          enum:
            - customer
            - vendor
        taxpayer_identifier:
          type: string
          description: Either a valid SSN or EIN.
    counterparty_update_request:
      type: object
      properties:
        name:
          type: string
          description: A new name for the counterparty. Will only update if passed.
        email:
          type: string
          description: A new email for the counterparty.
          format: email
        metadata:
          type: object
          additionalProperties:
            type: string
          description: >-
            Additional data in the form of key-value pairs. Pairs can be removed
