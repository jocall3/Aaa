// --- React Context and Hooks for API (Optional) ---
// Provides a way to easily access the API client and manage common state like auth tokens.

interface MoneyMovementContextType {
  api: MoneyMovementAPI | null;
  accessToken: string | null;
  setAccessToken: (token: string | null) => void;
  uuid: string;
  generateNewUuid: () => void;
  // Add other shared state/functions here
}

const MoneyMovementContext = createContext<MoneyMovementContextType | undefined>(undefined);

interface MoneyMovementProviderProps {
  children: React.ReactNode;
}

export const MoneyMovementProvider: React.FC<MoneyMovementProviderProps> = ({ children }) => {
  const [accessToken, setAccessToken] = useState<string | null>(null);
  const [uuid, setUuid] = useState<string>(() => crypto.randomUUID()); // Initialize UUID on first render

  useEffect(() => {
    // Optionally, fetch initial access token or check session storage
    const storedToken = localStorage.getItem('citi_access_token');
    if (storedToken) {
      setAccessToken(storedToken);
    }
  }, []);

  const generateNewUuid = useCallback(() => {
    setUuid(crypto.randomUUID());
  }, []);

  const api = new MoneyMovementAPI(API_BASE_URL, CLIENT_ID);

  const contextValue = {
    api,
    accessToken,
    setAccessToken: (token: string | null) => {
      setAccessToken(token);
      if (token) {
        localStorage.setItem('citi_access_token', token);
      } else {
        localStorage.removeItem('citi_access_token');
      }
    },
    uuid,
    generateNewUuid,
  };

  return (
    <MoneyMovementContext.Provider value={contextValue}>
      {children}
    </MoneyMovementContext.Provider>
  );
};

export const useMoneyMovement = () => {
  const context = useContext(MoneyMovementContext);
  if (!context) {
    throw new Error('useMoneyMovement must be used within a MoneyMovementProvider');
  }
  return context;
};

// --- WebSockets for real-time updates (Illustrative) ---
// This section demonstrates how you might integrate WebSocket functionality.
// In a real application, you'd manage connection state, re-connections, and message parsing.

interface WebSocketMessage {
  type: string;
  payload: any;
}

export const useMoneyMovementWebSocket = (onMessage: (message: WebSocketMessage) => void) => {
  useEffect(() => {
    const ws = new WebSocket(WEBSOCKET_URL);

    ws.onopen = () => {
      console.log('WebSocket connected to money movement webhooks.');
      // Optionally send an auth token or subscription message
    };

    ws.onmessage = (event) => {
      try {
        const message: WebSocketMessage = JSON.parse(event.data.toString());
        onMessage(message);
      } catch (error) {
        console.error('Failed to parse WebSocket message:', error);
      }
    };

    ws.onclose = () => {
      console.log('WebSocket disconnected from money movement webhooks.');
      // Implement re-connection logic here if needed
    };

    ws.onerror = (error) => {
      console.error('WebSocket error:', error);
    };

    return () => {
      ws.close();
    };
  }, [onMessage]);
};

// --- State Management with useReducer and Immer (Illustrative) ---
// For more complex state, `useReducer` with `immer` can simplify updates.

interface AppState {
  transactions: TransactionDetails[];
  isLoading: boolean;
  error: string | null;
}

type AppAction =
  | { type: 'FETCH_TRANSACTIONS_START' }
  | { type: 'FETCH_TRANSACTIONS_SUCCESS'; payload: TransactionDetails[] }
  | { type: 'FETCH_TRANSACTIONS_FAILURE'; payload: string }
  | { type: 'ADD_TRANSACTION'; payload: TransactionDetails }
  | { type: 'UPDATE_TRANSACTION_STATUS'; payload: { transactionId: string; newStatus: string } };

const appReducer = produce((draft: AppState, action: AppAction) => {
  switch (action.type) {
    case 'FETCH_TRANSACTIONS_START':
      draft.isLoading = true;
      draft.error = null;
      break;
    case 'FETCH_TRANSACTIONS_SUCCESS':
      draft.isLoading = false;
      draft.transactions = action.payload;
      break;
    case 'FETCH_TRANSACTIONS_FAILURE':
      draft.isLoading = false;
      draft.error = action.payload;
      break;
    case 'ADD_TRANSACTION':
      draft.transactions.push(action.payload);
      break;
    case 'UPDATE_TRANSACTION_STATUS':
      const index = draft.transactions.findIndex(t => t.transactionId === action.payload.transactionId);
      if (index !== -1) {
        draft.transactions[index].transactionStatus = action.payload.newStatus;
      }
      break;
  }
});

