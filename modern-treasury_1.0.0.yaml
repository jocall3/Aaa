    payment_order:
      minProperties: 45
      required:
        - accounting
        - accounting_category_id
        - accounting_ledger_class_id
        - amount
        - charge_bearer
        - compliance_rule_metadata
        - counterparty_id
        - created_at
        - currency
        - current_return
        - decision_id
        - description
        - direction
        - effective_date
        - expires_at
        - foreign_exchange_contract
        - foreign_exchange_indicator
        - id
        - ledger_transaction_id
        - live_mode
        - metadata
        - nsf_protected
        - object
        - originating_account_id
        - originating_party_name
        - priority
        - purpose
        - receiving_account
        - receiving_account_id
        - receiving_account_type
        - reference_numbers
        - remittance_information
        - send_remittance_advice
        - statement_descriptor
        - status
        - subtype
        - transaction_ids
        - transaction_monitoring_enabled
        - type
        - ultimate_originating_party_identifier
        - ultimate_originating_party_name
        - ultimate_receiving_party_identifier
        - ultimate_receiving_party_name
        - updated_at
        - vendor_failure_reason
      type: object
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
        live_mode:
          type: boolean
          description: >-
            This field will be true if this object exists in the live
            environment or false if it exists in the test environment.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        type:
          type: string
          description: >-
            One of `ach`, `eft`, `wire`, `check`, `sen`, `book`, `rtp`, `sepa`,
            `bacs`, `au_becs`, `interac`, `signet`, `provexchange`.
          enum:
            - ach
            - au_becs
            - bacs
            - book
            - card
            - check
            - cross_border
            - eft
            - interac
            - masav
            - neft
            - provxchange
            - rtp
            - sen
            - sepa
            - signet
            - wire
        subtype:
          type: string
          description: >-
            An additional layer of classification for the type of payment order
            you are doing. This field is only used for `ach` payment orders
            currently. For `ach`  payment orders, the `subtype`  represents the
            SEC code. We currently support `CCD`, `PPD`, `IAT`, `CTX`, `WEB`,
            `CIE`, and `TEL`.
          nullable: true
          enum:
            - CCD
            - CIE
            - CTX
            - IAT
            - PPD
            - TEL
            - WEB
        amount:
          type: integer
          description: >-
            Value in specified currency's smallest unit. e.g. $10 would be
            represented as 1000 (cents). For RTP, the maximum amount allowed by
            the network is $100,000.
        direction:
          type: string
          description: >-
            One of `credit`, `debit`. Describes the direction money is flowing
            in the transaction. A `credit` moves money from your account to
            someone else's. A `debit` pulls money from someone else's account to
            your own. Note that wire, rtp, and check payments will always be
            `credit`.
          enum:
            - credit
            - debit
        priority:
          type: string
          description: >-
            Either `normal` or `high`. For ACH and EFT payments, `high`
            represents a same-day ACH or EFT transfer, respectively. For check
            payments, `high` can mean an overnight check rather than standard
            mail.
          enum:
            - high
            - normal
        originating_account_id:
          type: string
          description: The ID of one of your organization's internal accounts.
          format: uuid
        receiving_account_id:
          type: string
          description: >-
            The receiving account ID. Can be an `external_account` or
            `internal_account`.
          format: uuid
        accounting:
          $ref: '#/components/schemas/accounting'
        accounting_category_id:
          type: string
          description: >-
            The ID of one of your accounting categories. Note that these will
            only be accessible if your accounting system has been connected.
          format: uuid
          nullable: true
          deprecated: true
        accounting_ledger_class_id:
          type: string
          description: >-
            The ID of one of your accounting ledger classes. Note that these
            will only be accessible if your accounting system has been
            connected.
          format: uuid
          nullable: true
          deprecated: true
        currency:
          $ref: '#/components/schemas/currency'
        effective_date:
          type: string
          description: >-
            Date transactions are to be posted to the participants' account.
            Defaults to the current business day or the next business day if the
            current day is a bank holiday or weekend. Format: yyyy-mm-dd.
          format: date
        description:
          type: string
          description: An optional description for internal use.
          nullable: true
        statement_descriptor:
          type: string
          description: >-
            An optional descriptor which will appear in the receiver's
            statement. For `check` payments this field will be used as the memo
            line. For `ach` the maximum length is 10 characters. Note that for
            ACH payments, the name on your bank account will be included
            automatically by the bank, so you can use the characters for other
            useful information. For `eft` the maximum length is 15 characters.
          nullable: true
        remittance_information:
          type: string
          description: >-
            For `ach`, this field will be passed through on an addenda record.
            For `wire` payments the field will be passed through as the
            "Originator to Beneficiary Information", also known as OBI or
            Fedwire tag 6000.
          nullable: true
        purpose:
          type: string
          description: >-
            For `wire`, this is usually the purpose which is transmitted via the
            "InstrForDbtrAgt" field in the ISO20022 file. If you are using
            Currencycloud, this is the `payment.purpose_code` field. For `eft`,
            this field is the 3 digit CPA Code that will be attached to the
            payment.
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          description: >-
            Additional data represented as key-value pairs. Both the key and
            value must be strings.
          example:
            key: value
            foo: bar
            modern: treasury
        charge_bearer:
          type: string
          description: >-
            The party that will pay the fees for the payment order. Only applies
            to wire payment orders. Can be one of shared, sender, or receiver,
            which correspond respectively with the SWIFT 71A values `SHA`,
            `OUR`, `BEN`.
          nullable: true
          enum:
            - shared
            - sender
            - receiver
        foreign_exchange_indicator:
          type: string
          description: >-
            Indicates the type of FX transfer to initiate, can be either
            `variable_to_fixed`, `fixed_to_variable`, or `null` if the payment
            order currency matches the originating account currency.
          nullable: true
          enum:
            - fixed_to_variable
            - variable_to_fixed
        foreign_exchange_contract:
          type: string
          description: >-
            If present, indicates a specific foreign exchange contract number
            that has been generated by your financial institution.
          nullable: true
        nsf_protected:
          type: boolean
          description: >-
            A boolean to determine if NSF Protection is enabled for this payment
            order. Note that this setting must also be turned on in your
            organization settings page.
        originating_party_name:
          type: string
          description: >-
            If present, this will replace your default company name on
            receiver's bank statement. This field can only be used for ACH
            payments currently. For ACH, only the first 16 characters of this
            string will be used. Any additional characters will be truncated.
          nullable: true
        ultimate_originating_party_name:
          type: string
          description: Name of the ultimate originator of the payment order.
          nullable: true
        ultimate_originating_party_identifier:
          type: string
          description: Identifier of the ultimate originator of the payment order.
          nullable: true
        ultimate_receiving_party_name:
          type: string
          nullable: true
        ultimate_receiving_party_identifier:
          type: string
          nullable: true
        send_remittance_advice:
          type: boolean
          description: >-
            Send an email to the counterparty when the payment order is sent to
            the bank. If `null`, `send_remittance_advice` on the Counterparty is
            used.
          nullable: true
        expires_at:
          type: string
          description: >-
            RFP payments require an expires_at. This value must be past the
            effective_date.
          format: date-time
          nullable: true
        status:
          type: string
          description: The current status of the payment order.
          enum:
            - approved
            - cancelled
            - completed
            - denied
            - failed
            - needs_approval
            - pending
            - processing
            - returned
            - reversed
            - sent
        receiving_account:
          description: >-
            The receiving account. Can be an `external_account` or
            `internal_account`.
          nullable: true
          deprecated: true
          oneOf:
            - minProperties: 16
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                object:
                  type: string
                live_mode:
                  type: boolean
                  description: >-
                    This field will be true if this object exists in the live
                    environment or false if it exists in the test environment.
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
                discarded_at:
                  type: string
                  format: date-time
                  nullable: true
                account_type:
                  type: string
                  description: Can be `checking`, `savings` or `other`.
                  enum:
                    - cash
                    - checking
                    - loan
                    - non_resident
                    - other
                    - overdraft
                    - savings
                party_type:
                  type: string
                  description: Either `individual` or `business`.
                  nullable: true
                  enum:
                    - business
                    - individual
                party_address:
                  $ref: '#/components/schemas/address'
                name:
                  type: string
                  description: >-
                    A nickname for the external account. This is only for
                    internal usage and won't affect any payments
                  nullable: true
                account_details:
                  type: array
                  items:
                    $ref: '#/components/schemas/account_detail'
                routing_details:
                  type: array
                  items:
                    $ref: '#/components/schemas/routing_detail'
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Additional data represented as key-value pairs. Both the key
                    and value must be strings.
                  example:
                    key: value
                    foo: bar
                    modern: treasury
                party_name:
                  type: string
                  description: The legal name of the entity which owns the account.
                contact_details:
                  type: array
                  items:
                    $ref: '#/components/schemas/contact_detail'
                verification_status:
                  type: string
                  enum:
                    - pending_verification
                    - unverified
                    - verified
              additionalProperties: false
            - $ref: '#/components/schemas/internal_account'
        receiving_account_type:
          type: string
          enum:
            - internal_account
            - external_account
        counterparty_id:
          type: string
          description: >-
            If the payment order is tied to a specific Counterparty, their id
            will appear, otherwise `null`.
          format: uuid
          nullable: true
        transaction_ids:
          type: array
          description: >-
            The IDs of all the transactions associated to this payment order.
            Usually, you will only have a single transaction ID. However, if a
            payment order initially results in a Return, but gets redrafted and
            is later successfully completed, it can have many transactions.
          items:
            type: string
            format: uuid
        ledger_transaction_id:
          type: string
          description: The ID of the ledger transaction linked to the payment order.
          format: uuid
          nullable: true
        current_return:
          $ref: '#/components/schemas/return'
        transaction_monitoring_enabled:
          type: boolean
          description: >-
            A flag that determines whether a payment order should go through
            transaction monitoring.
        compliance_rule_metadata:
          type: object
          description: >-
            Custom key-value pair for usage in compliance rules. Please contact
            support before making changes to this field.
          nullable: true
        reference_numbers:
          type: array
          items:
            $ref: '#/components/schemas/payment_reference'
        vendor_failure_reason:
          type: string
          description: >-
            This field will be populated if a vendor (e.g. Currencycloud)
            failure occurs. Logic shouldn't be built on its value as it is
            free-form.
          nullable: true
        decision_id:
          type: string
          description: >-
            The ID of the compliance decision for the payment order, if
            transaction monitoring is enabled.
          format: uuid
