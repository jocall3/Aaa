openapi: 3.0.1
info:
  title: SecurityE2EKeyExchangePreLogin_Partner_OpenAPI
  description: This pre-login Proxy is used by browser based applications for retrieving
    the public key used for encryption.
  version: 1.0.0
  x-deployment-reference: ""
  x-linked-api: GetEncryptionKeyPreLogin
servers:
- url: https://127.0.0.1/openapi/partner/v1/prelogin/security/e2eKey
paths:
  /:
    get:
      tags:
      - Foundations_Utilities_Encrytion and Decryption
      summary: Retrieve Public Key  During Pre login for Partner
      description: "This API is used to retrieve  the public key for encryption of\
        \ sensitive data  while  Pre Login use cases like Customer On Boarding etc,."
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/uuid'
      - $ref: '#/components/parameters/Accept'
      - $ref: '#/components/parameters/client_id'
      - $ref: '#/components/parameters/clientDetails'
      responses:
        "200":
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEncryptionKeyResponse'
        "400":
          description: <table><tr><td>Type</td><td>Code</td><td>Details</td></tr><tr><td>invalid</td><td>invalidRequest</td><td>Missing
            or invalid Parameters</td></tr><tr><td>error</td><td>cannotRetrieveKeyInfo</td><td>cannot
            retrieve public key.</td></tr><tr><td>error</td><td>e2eDisabled</td><td>E2E
            is disabled.</td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: <table><tr><td>error</td><td>unAuthorized</td><td>Authorization
            credentials are missing or invalid</td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: <table><tr><td>error</td><td>accessNotConfigured</td><td>The
            request operation is not configured to access this resource</td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: <table><tr><td>error</td><td>resourceNotFound</td><td>Empty
            resource/resource not found</td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: <table><tr><td>fatal</td><td>serverUnavailable</td><td>The
            request failed due to an internal error/server unavailability</td></tr></table>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    GetEncryptionKeyResponse:
      required:
      - exponent
      - modulus
      type: object
      properties:
        modulus:
          type: string
          description: Public key modulus to be used for encrypting the pin
          example: 
        exponent:
          type: string
          description: Public key exponent to to be used for encrypting the pin
          example: "3"
        keyIdentifier:
          type: string
          description: This refer to unique identifier for the public key for security
            gateway
          example: CARD_LOGIN
    ErrorResponse:
      required:
      - code
      - type
      type: object
      properties:
        type:
          type: string
          description: Invalid - Request did not confirm to the specification and
            was unprocessed and rejected. Please fix the value and try again
          enum:
          - error
          - warn
          - invalid
          - fatal
        code:
          type: string
          description: Error code which qualifies the error
        details:
          type: string
          description: Human readable explanation specific to the occurrence of the
            problem
        location:
          type: string
          description: The name of the field that resulted in the error
        moreInfo:
          type: object
          properties: {}
          description: URI to human readable documentation of the erro
  parameters:
    Authorization:
      name: Authorization
      in: header
      description: Access token to authenticate your request.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    uuid:
      name: uuid
      in: header
      description: 128 bit random UUID generated uniquely for every request.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    Accept:
      name: Accept
      in: header
      description: Content-Type that are acceptable for the response.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    client_id:
      name: client_id
      in: header
      description: Client ID generated during application registration.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    clientDetails:
      name: clientDetails
      in: header
      description: "This field is used to capture device,browser and network information.\
        \ Refer the developer portal for more information.These are the fields which\
        \ will be passed as part of the header devicePrint,deviceTokenCookie,userIpAddress,userAgent,hardwareId,simId,deviceModel,deviceName,deviceOsName,deviceOsVersion,multitaskingSupportFlag,languageSupport,wifiMacAddress,cellTowerId,locationAreaCode,rsaApplicationKey,wapClientId,mobileCarrierCode,mobileCountryCode,osId,geoLongitude,geoLatitude,geoHorizontalAccuracy,geoAltitude,geoAltitudeAccuracy,geoSpeed,geoTimestamp,geoStatus,basicServiceSetId,signalStrength,wifiChannel,serviceSetId"
      required: false
      style: simple
      explode: false
      schema:
        type: string
