        example: XXXXX1035
      transactionDate:
        type: string
        format: date
        description: Transaction timestamp in ISO 8601 YYYY-MM-DD format
        example: "2016-04-15"
      transactionType:
        type: string
        description: The type of transaction.  Valid values are PAYMENT, PURCHASE,
          CASH_ADVANCE, FEE, INTEREST_CHARGED, PURCHASE_CREDIT and CREDIT
        enum:
        - PAYMENT
        - PURCHASE
        - CASH_ADVANCE
        - FEE
        - INTEREST_CHARGED
        - PURCHASE_CREDIT
        - CREDIT
        example: PURCHASE
      transactionAmount:
        type: number
        format: double
        description: The transaction amount, in the primary currency of the account
        example: 50.550000
      debitCreditMemo:
        $ref: '#/definitions/DebitCreditMemo'
      transactionId:
        type: string
        description: Transaction Id to uniquely identify the transaction. Conditional
          on transaction type and status; not available for pending and system-generated
          transactions
        example: 464684877
      transactionDescription:
        type: string
        description: Description explaining the details of the transaction.
        example: Loan payment for the month of June
      transactionDescriptionExtension:
        type: string
        description: Additional transaction description,
        example: TELEPHONE Reference# 545226
      transactionStatus:
        type: string
        description: The status of the transaction. Valid values are either PENDING
          or POSTED
        enum:
        - PENDING
        - POSTED
        example: POSTED
      transactionPostingDate:
        type: string
        format: date
        description: The date that the transaction was posted to the account and into
          Citi's system in YYYY-MM-DD format (EST).
        example: "2016-04-16"
      currencyCode:
        type: string
        description: The currency code is a 3-character code (ISO 4217 format) that
          identifies the currency type for the customer's account and transaction.
        example: USD
      checkNumber:
        type: string
        description: Check number for line of credit transactions.
        example: 1007
  BrokerageAccountTransaction:
    required:
    - accountId
    - currencyCode
    - assetClass
    - assetType
    - longActivityDescription
    - shortActivityDescription
    - transactionDateTime
    - transactionId
    - transactionType
    - buySellIndicator
    - securityIdentifier
    properties:
      accountId:
        type: string
        description: Long-term persistent identity of the account. Not an account
          number.
        example: c09d172a-d244-4324-bba9-b03b8aa17a76-INV
      displayAccountNumber:
        type: string
        description: A masked account number that can be displayed to the customer
        example: XXXXX1035
      currencyCode:
        type: string
        description: The currency code of the transaction in ISO 4217 format
        example: USD
      securityIdentifier:
        $ref: '#/definitions/SecurityIdentifier'
      assetClass:
        type: string
        description: 'Asset class value displayed on the application for asset allocation
          chart. Possible values: CORPDEBT, CURRENCY, EQUITY, ASSTBACK etc.'
        example: CURRENCY
      assetType:
        type: string
        description: 'Asset type assigned to a holding. Possible values: CORPDEBT,
          CURRENCY, EQUITY, ASSTBACK etc.'
        example: CORPDEBT
      buySellIndicator:
        $ref: '#/definitions/BuySellIndicatorType'
      longActivityDescription:
        type: string
        description: Long activity description.
        example: Sold 100 Shares of C @ $61.0
      netAmount:
        type: number
        format: double
        description: Net amount of transaction.
        example: 10000
      priceAmount:
        type: number
        format: double
        description: Price amount of the security.
        example: 10000
      principalAmount:
        type: number
        format: double
        description: Principal amount of trade. The amount of payment applied to the
          principal. Only present for historical transactions, not intra-day
        example: 10000
      quantity:
        type: number
        format: double
        description: Quantity of security at the time of trade.
        example: 10000
      settlementDate:
        type: string
        format: date
        description: Settlement data of trade transaction.
        example: "2016-04-15"
      shortActivityDescription:
        type: string
        description: Short activity description.
        example: Shares sold
      tradeNumber:
        type: string
        description: Trade reference number of trade transactions.
        example: "2788888886"
      tradeTransactionFlag:
        type: string
        description: Flag to indicate trade related transaction.
        example: true
      transactionDateTime:
        type: string
        format: date
        description: Transaction timestamp.
        example: "2016-04-15"
      transactionId:
        type: string
        description: TradeNumber is the identifier used to relate a transaction with
          trade orders.
        example: "7688682459"
      transactionType:
        type: string
        description: 'PAYMENT, PURCHASE, CASH_ADVANCES, FEES,INTEREST_CHARGES, PURCHASE_CREDIT,
          CREDIT, WITHDRAWAL_OR_DEPOSIT, SECURITY_TRANSACTION, DIVIDEND_AND_INTEREST,
          OTHER, COMMON_STOCK_TRANSACTION, PREFERRED_STOCK_TRANSACTION, OPTIONS_TRANSACTION,
          MUTUAL_FUND_TRANSACTION, BOND_TRANSACTION, CERTIFICATE_OF_DEPOSIT_TRANSACTION,
          ADJUSTMENTS '
        enum:
        - PAYMENT
        - PURCHASE
        - CASH_ADVANCES
        - FEES
        - INTEREST_CHARGES
        - PURCHASE_CREDIT
        - CREDIT
        - WITHDRAWAL_OR_DEPOSIT
        - SECURITY_TRANSACTION
        - DIVIDEND_AND_INTEREST
        - OTHER
        - COMMON_STOCK_TRANSACTION
        - PREFERRED_STOCK_TRANSACTION
        - OPTIONS_TRANSACTION
        - MUTUAL_FUND_TRANSACTION
        - BOND_TRANSACTION
        - CERTIFICATE_OF_DEPOSIT_TRANSACTION
        - ADJUSTMENTS
        example: PAYMENT
  SecurityIdentifier:
    properties:
      symbol:
        type: string
        description: Symbol of a traded security.
        example: C
      cusip:
        type: string
        description: Cusip of a traded security.
        example: 172967GD7
  BuySellIndicatorType:
    type: string
    description: Buy sell indicator type
    enum:
    - BUY
    - SELL
    - NONE
    example: BUY
  DebitCreditMemo:
    type: string
    description: Transaction feed indicator showing whether the transaction amount
      is coming into account or going out of account. Valid values include - DEBIT,
      CREDIT.
    enum:
    - DEBIT
    - CREDIT
    example: DEBIT
  Customer:
    properties:
      customerId:
        type: string
        description: Unique Citi Customer ID number used to identify the end customer
          and aggregate the end customer's different accounts, bringing those multiple
          accounts into one value. Note - The Customer ID is a randomly generated
          number and is created one time only. The Customer ID should not be displayed
          to the end customer. The customer must have successfully authenticated for
          this field to pass. This field is unique to the third party aggregator and
          is persistent, i.e. a new customer ID field will be generated for each third
          party’s customer.
        example: bd12a6d89815aed77be876225b9a2c7f6648f0af82e84198f49d1b7e51a23fae1621936bc1addf5fdceca25c3aae5f92071fb1d6218dae32ca83b199c29962ee
  X5Certificates:
    type: array
    items:
      type: string
    example:
    - 07cceb63ea50b385336e7f6887
    - MIID8TCCAtmgAwIBAgIUHhjRZWi
  ErrorList:
    properties:
      errors:
        type: array
        description: List of one or more errors
        items:
          $ref: '#/definitions/ErrorResponse'
  ErrorResponse:
    properties:
      type:
        type: string
        enum:
        - error
        - warn
        - invalid
        - fatal
        description: <br>invalid - Request did not confirm to the specification and
          was unprocessed & rejected. Please fix the value and try again</br>                         <br>warn
          - Request was partially processed.  E.g. some of the fields are missing
          in response to the system issues,  request was accepted successfully but
          will be processed asynchronously</br> <br>error - The request was accepted
          but could not be processed successfully</br>            <br>fatal - There
          was an internal system error while processing the request. These are technical
          errors and will be resolved by Citi, and the consumer should retry after
          some time. Business errors will not be categorized as fatal </br>
      code:
        type: string
        description: Error code which qualifies the error
      details:
        type: string
        description: Human readable explanation specific to the occurrence of the
          problem
      location:
        type: string
        description: The name of the field that resulted in the error
      moreInfo:
        type: string
        description: URI to human readable documentation of the error
    required:
    - type
    - code
consumes:
- application/json
produces:
- application/json
- charset=UTF-8
host: sandbox.apihub.citi.com
...
