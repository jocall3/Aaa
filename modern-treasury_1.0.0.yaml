          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: effective_date
          in: query
          description: >-
            Use `gt` (>), `gte` (>=), `lt` (<), `lte` (<=), or `eq` (=) to
            filter by the transaction's effective date. Format YYYY-MM-DD
          required: false
          style: deepObject
          explode: false
          schema:
            type: object
            additionalProperties:
              type: string
              format: date
        - name: effective_at
          in: query
          description: >-
            Use "gt" (>), "gte" (>=), "lt" (<), "lte" (<=), or "eq" (=) to
            filter by the transaction's effective time. Format ISO8601
          required: false
          style: deepObject
          explode: false
          schema:
            type: object
            additionalProperties:
              type: string
              format: time
        - name: updated_at
          in: query
          description: >-
            Use `gt` (>), `gte` (>=), `lt` (<), `lte` (<=), or `eq` (=) to
            filter by the posted at timestamp. For example, for all times after
            Jan 1 2000 12:00 UTC, use updated_at%5Bgt%5D=2000-01-01T12:00:00Z.
          required: false
          style: deepObject
          explode: false
          schema:
            type: object
            additionalProperties:
              type: string
              format: date-time
        - name: ledger_account_lock_version
          in: query
          description: >-
            Use `gt` (>), `gte` (>=), `lt` (<), `lte` (<=), or `eq` (=) to
            filter by the lock_version of a ledger account. For example, for all
            entries created at or before before lock_version 1000 of a ledger
            account, use ledger_account_lock_version%5Blte%5D=1000
          required: false
          style: deepObject
          explode: false
          schema:
            type: object
            additionalProperties:
              type: integer
        - name: ledger_account_category_id
          in: query
          description: >-
            Get all ledger entries that match the direction specified. One of
            `credit`, `debit`.
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: show_deleted
          in: query
          description: >-
            If true, response will include ledger entries that were deleted.
            When you update a ledger transaction to specify a new set of
            entries, the previous entries are deleted.
          required: false
          style: form
          explode: true
          schema:
            type: boolean
        - name: direction
          in: query
          description: >-
            If true, response will include ledger entries that were deleted.
            When you update a ledger transaction to specify a new set of
            entries, the previous entries are deleted.
          required: false
          style: form
          explode: true
          schema:
            type: string
            enum:
              - credit
              - debit
        - name: status
          in: query
          description: >-
            Get all ledger entries that match the status specified. One of
            `pending`, `posted`, or `archived`.
          required: false
          style: form
          explode: true
          schema:
            type: string
            enum:
