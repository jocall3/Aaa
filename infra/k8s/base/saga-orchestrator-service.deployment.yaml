apiVersion: v1
kind: ServiceAccount
metadata:
  name: saga-orchestrator-service-sa
  namespace: microservices-platform
  labels:
    app.kubernetes.io/name: saga-orchestrator-service
    app.kubernetes.io/part-of: microservices-platform
---
apiVersion: v1
kind: Service
metadata:
  name: saga-orchestrator-service
  namespace: microservices-platform
  labels:
    app.kubernetes.io/name: saga-orchestrator-service
    app.kubernetes.io/part-of: microservices-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: saga-orchestrator-service
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-orchestrator-service
  namespace: microservices-platform
  labels:
    app.kubernetes.io/name: saga-orchestrator-service
    app.kubernetes.io/part-of: microservices-platform
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saga-orchestrator-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saga-orchestrator-service
        tier: backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "saga-orchestrator-service"
        vault.hashicorp.com/agent-inject-secret-db-creds: "secret/data/saga-db"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "secret/data/saga-db" -}}
          export DATABASE_USER="{{ .Data.data.username }}"
          export DATABASE_PASSWORD="{{ .Data.data.password }}"
          {{- end }}
    spec:
      serviceAccountName: saga-orchestrator-service-sa
      containers:
        - name: saga-orchestrator-service
          image: bank-of-anthos/saga-orchestrator-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: KAFKA_BROKERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: SCHEMA_REGISTRY_URL
              value: "http://schema-registry.kafka.svc.cluster.local:8081"
            - name: DATABASE_HOST
              value: "postgres-primary.database.svc.cluster.local"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: "saga_state_store"
            - name: SAGA_DEFINITIONS_PATH
              value: "/etc/sagas"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: saga-definitions
              mountPath: /etc/sagas
              readOnly: true
      volumes:
        - name: saga-definitions
          configMap:
            name: saga-definitions-configmap