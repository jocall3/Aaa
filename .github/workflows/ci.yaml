name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-specs:
    name: Validate OpenAPI Specifications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Spectral CLI
        run: npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI Specifications
        run: |
          # This will validate all OpenAPI specifications against the default ruleset.
          # A custom ruleset should be developed to enforce organization-specific standards.
          spectral lint ./**/*.yaml --ruleset oas
          spectral lint ./**/*.yml --ruleset oas

  docs-and-compliance:
    name: Documentation and Compliance Checks
    runs-on: ubuntu-latest
    steps:
