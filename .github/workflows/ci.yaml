      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  build-test-services:
    name: Build & Test Microservices
    needs: [validate-specs]
    runs-on: ubuntu-latest
    # The matrix should be dynamically populated based on changed services in a monorepo.
    strategy:
      fail-fast: false
      matrix:
        service: [accounts, payments, user-identity, rewards]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup all required language environments for the polyglot architecture.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

