---
swagger: "2.0"
info:
  version: 2.0.0
  title: Accounts
  description: |-
    The Accounts API lets you retrieve account and transaction data for Citi Customers who have authorized your app. In most cases, you&#039;ll want to request a summary of all accounts first, which will return basic account information and account IDs. Once you have this information, you can request additional account details and/or transactions.








    The API can return information for cards, checking, savings, loans, line of credit and bokerage accounts. We are working hard to extend this API to return additional types of accounts. Stay tuned for more!
basePath: /gcb//api
schemes:
- https
tags: []
paths:
  /v2/accounts/details:
    get:
      summary: Retrieve details of all accounts
      description: Returns account details for all accounts held by Citi customers
        who have authorized your app. For example, if a customer has multiple credit
        card accounts, the accounts will be returned in the array creditCardAccountsDetails
        within accountGroupDetails.<br>Currently, the API supports cards, checking
        & savings, loans, line of credit, brokerage and retirement accounts.
      parameters:
      - name: Authorization
        in: header
        description: 'The most recent Authorization token. This will have the format
          Bearer + {space} + {accessToken}. Example: Bearer KGNsaWVudF9pZDpjbGllbnRfc2VjcmV0KQ==.'
        type: string
        required: true
      - name: uuid
        in: header
        description: 128 bit random UUID generated uniquely for every request
        type: string
        required: true
      - name: Accept
        in: header
        description: Content-Type that are acceptable for the response
        type: string
        required: true
      - name: client_id
        in: header
        description: client_id generated during consumer onboarding
        type: string
        required: true
      responses:
        200:
          description: Successful operation
          schema:
            $ref: '#/definitions/AccountsGroupDetailsList'
        400:
          description: <table class="table"><tr><td>Type</td><td>Code</td><td>Details</td></tr><tr><td>invalid</td><td>invalidRequest</td><td>Missing
            or invalid parameters</td></tr><tr><td>error</td><td>noAccounts</td><td>No
            active accounts or No accounts linked for customer</td></tr></table>
          schema:
            $ref: '#/definitions/ErrorList'
        401:
          description: <table class="table"><tr><td>Type</td><td>Code</td><td>Details</td></tr><tr><td>error</td><td>unAuthorized</td><td>Authorization
            credentials are missing or invalid</td></tr></table>
          schema:
            $ref: '#/definitions/ErrorList'
        403:
          description: <table><tr><td>Type</td><td>Code</td><td>Details</td><td>More
            Info</td></tr><tr><td>error</td><td>accessNotConfigured</td><td>The request
            operation is not configured to access this resource</td><td>Channel/Country/Business
            provided in the request is not supported currently</td></tr></table>
          schema:
            $ref: '#/definitions/ErrorList'
        404:
          description: <table><tr><td>Type</td><td>Code</td><td>Details</td></tr><tr><td>fatal</td><td>serverUnavailable</td><td>The
            request failed due to an internal error/server unavailability</td></tr></table>
          schema:
            $ref: '#/definitions/ErrorList'
        500:
          description: <table class="table"><tr><td>Type</td><td>Code</td><td>Details</td></tr><tr><td>fatal</td><td>serverUnavailable</td><td>The
            request failed due to an internal error</td></tr></table>
          schema:
            $ref: '#/definitions/ErrorList'
  /v2/accounts/{accountId}/encrypt/accountRoutingNumber:
    get:
      description: Retrieve routing number(clear text) and encrypted account number
        of a specific account
      summary: Retrieve routing number(clear text) and encrypted account number of
        a specific account
      parameters:
      - name: accountId
        in: path
        description: Encrypted Account token or account guid
        required: true
        type: string
      - name: Authorization
        in: header
        description: Oauth Header
        required: true
        type: string
      - name: uuid
        in: header
        description: 128 bit random UUID generated uniquely for every request
        required: true
        type: string
      - name: Accept
        in: header
        description: Content-Type that are acceptable for the response
        required: true
        type: string
      - name: client_id
        in: header
        description: client_id generated during consumer onboarding
        required: true
        type: string
      responses:
        200:
          description: Successful operation.
          schema:
            $ref: '#/definitions/EncryptedAccountRoutingNumber'
        400:
          description: <table><tr><td>Type</td><td>Code</td><td>Details</td></tr><tr><td>error</td><td>invalidRequest</td><td>Missing
            or invalid Parameters</td></tr></table>
          schema:
            $ref: '#/definitions/Http400Response'
        401:
          description: <table><tr><td>Type</td><td>Code</td><td>Details</td></tr><tr><td>error</td><td>unAuthorized</td><td>Authorization
            credentials are missing or invalid</td></tr></table>
          schema:
            $ref: '#/definitions/Http401Response'
        403:
          description: <table><tr><td>Type</td><td>Code</td><td>Details</td><td>More
            Info</td></tr><tr><td>error</td><td>accessNotConfigured</td><td>The request
            operation is not configured to access this resource</td><td>Channel/Country/Business
            provided in the request is not supported currently</td></tr></table>
          schema:
            $ref: '#/definitions/ErrorList'
        404:
          description: <table><tr><td>Type</td><td>Code</td><td>Details</td></tr><tr><td>error</td><td>resourceNotFound</td><td>The
            requested resource was not found</td></tr></table>
          schema:
            $ref: '#/definitions/Http404Response'
        500:
          description: <table><tr><td>Type</td><td>Code</td><td>Details</td></tr><tr><td>fatal</td><td>serverUnavailable</td><td>The
            request failed due to an internal error/server unavailability</td></tr></table>
          schema:
            $ref: '#/definitions/ErrorList'
  /v2/accounts/{accountId}/transactions:
    get:
      summary: Retrieve transactions
      description: Returns an array of transactions for the specified account. For
        example, the transactions for a credit card account will be returned in a
        creditCardAccountTransactions array object. <br>Currently, the API supports
        cards, checking, savings, loans, line of credit and brokerage account transactions.
      parameters:
      - name: accountId
        in: path
        description: Temporary unique identifier associated with an account
        required: true
        type: string
      - name: transactionFromDate
        in: query
        description: Starting range for transaction date in ISO 8601 date format 'YYYY-MM-DD'.
        type: string
        required: true
        format: date
      - name: transactionToDate
        in: query
        description: End range for transaction date in ISO 8601 date format 'YYYY-MM-DD'.
          If transactionToDate is present, transactionFromDate is required.
        type: string
        format: date
      - name: Authorization
        in: header
        description: The Authorization Token received in earlier API call. This will
          contain the Access Token
        type: string
        required: true
      - name: uuid
        in: header
        description: A 128 bit universally unique identifier (UUID) that you generate
          for every request and is used for tracking. It is recommended to use the
          output from Java UUID class or an equivalent
        type: string
        required: true
      - name: Accept
        in: header
        description: Content-Types that are acceptable for the response.
        type: string
        required: true
      - name: client_id
        in: header
        description: The client_id generated during consumer onboarding
        type: string
        required: true
      responses:
        200:
          description: Successful operation
          schema:
            $ref: '#/definitions/GetAccountTransactionsResp'
        204:
          description: No Content
        400:
          description: <table> <tr> <td>error</td> <td>invalidRequest</td> <td>Missing
            or invalid request parameters</td> </tr> <tr> <td>error</td> <td>invalidTransactionFromDate</td><td>The
            transactionFromDate provided is invalid. The date format is YYYYMMDD.</td>
            </tr> <tr> <td>error</td> <td>invalidTransactionToDate</td><td>The transactionToDate
            provided is invalid. The date format is YYYYMMDD.</td></tr> <tr> <td>error</td>
            <td>transactionFromToDateComboInvalid</td><td>The transactionFromDate
            value is greater (later) than the transactionToDate value.</td> </tr>
            <tr> <td>error</td> <td>tranxFromDate2YrsPriorToCurrDate</td><td>Transaction
            from date should not be 24 months prior to current date.</td></tr> <tr>
            <td>error</td> <td>tranxToDateAfterCurrDate</td> <td>Transaction to date
            should not be after current date.</td> </tr> </table>
          schema:
            $ref: '#/definitions/ErrorList'
        401:
          description: <table><tr><td>Type</td><td>Code</td><td>Details</td></tr><tr><td>error</td><td>unAuthorized</td><td>Authorization
            credentials are missing or invalid</td></tr></table>
          schema:
            $ref: '#/definitions/ErrorList'
        403:
          description: <table><tr><td>Type</td><td>Code</td><td>Details</td><td>More
            Info</td></tr><tr><td>error</td><td>accessNotConfigured</td><td>The request
            operation is not configured to access this resource</td><td>Channel/Country/Business
            provided in the request is not supported currently</td></tr></table>
          schema:
            $ref: '#/definitions/ErrorList'
        404:
          description: <table> <tr> <td>Type</td> <td>Code</td> <td>Details</td></tr>
            <tr> <td>error</td> <td>resourceNotFound</td> <td>Resource not found</td>
            </tr> </table>
          schema:
            $ref: '#/definitions/ErrorList'
        500:
          description: <table><tr><td>Type</td><td>Code</td><td>Details</td></tr><tr><td>fatal</td><td>serverUnavailable</td><td>The
            request failed due to an internal error</td></tr></table>
          schema:
            $ref: '#/definitions/ErrorList'
definitions:
  EncryptedAccountRoutingNumber:
    properties:
      encryptedAccountNumber:
        type: object
        properties:
          encryptedPayload:
            type: object
            description: Encrypted Account number object with details to decrypt in
              header
            required:
            - encrypted_key
            - iv
            - ciphertext
            - authTag
            - aad
            properties:
              header:
                type: object
                required:
                - alg
                - enc
                - kid
                - x5c
                - cty
                properties:
                  zip:
                    type: string
                    description: The zip (compression algorithm) Header Parameter,
                      which is optional, is applied to the plaintext before encryption,
                      if any. Default value of zip is Compression with the DEFLATE
                      algorithm
                    example: DEF
                    default: DEF
                  alg:
                    type: string
                    description: The alg (algorithm) Header Parameter identifies the
                      cryptographic algorithm used to encrypt or determine the value
                      of the CEK
                    example: RSA-OAEP-256
                  enc:
                    type: string
                    description: The enc (encryption algorithm) Header Parameter identifies
                      the content encryption algorithm used to perform authenticated
                      encryption on the plaintext to produce the ciphertext and the
                      Authentication Tag
                    example: A256CBC-HS512
                  kid:
                    type: string
                    description: The kid (key ID) Header Parameter is a Hint indicating
                      which key was used to secure the JWE
                    example: Citi_2020-02-10
                  x5c:
                    type: object
                    $ref: '#/definitions/X5Certificates'
                    description: The x5u (X.509 URL) Header Parameter is a URI that
                      refers to a resource for the X.509 public key certificate or
                      certificate chain corresponding to the key used to digitally
                      sign the JWS
                  cty:
                    type: string
                    description: The cty (content type) Header Parameter is used by
                      JWS applications to declare the media type [IANA.MediaTypes]
                      of the secured content (the payload)
                    example: text/plain
              encrypted_key:
                type: string
                description: Base64encoded JWE Encrypted key
                example: 8b3021f817b01a64c419213d70bbd0552c
              iv:
                type: string
                description: Initialization vector
                example: cf532cc7c81046e66541791001
              ciphertext:
                type: string
                description: Encrypted account number text
                example: 47ecwvmLhO1amdatjLdSr8Q+B8CRVXUX6Ez7JiFieEaeKtrRu99JDoX4u1FQarMkZZDaJ65
                  eVuZ4RXU4xvNeEJHToQx3iboo1hyDLOhMdoSLPJQfx46
              authTag:
                type: string
                description: An output of an AEAD operation that ensures the integrity
                  of the ciphertext and the Additional Authenticated Data. Note that
                  some algorithms may not use an Authentication Tag, in which case
                  this value is the empty octet sequence.
                example: PGdwAzKMbpt9jTE6YDEZ2GNMCTlrPuL4Hu2gAFOtZbA
              aad:
                type: string
                description: Additional Authenticated Data value to be integrity protected
                  by the authenticated encryption operation.  This can only be present
                  when using the JWE JSON Serialization.  (Note that this can also
                  be achieved when using either the JWE Compact Serialization or the
                  JWE JSON Serialization by including the AAD value as an integrity-protected
                  Header Parameter value, but at the cost of the value being double
                  base64url encoded.)
                example: n_WoDmI9OQFDy4suLquWqKNoctGXQIjpjNGOrUD2uDk7gzJBSSaiD4UYdise45GhaVhbiZeVU
      routingNumber:
        type: string
        description: ABA routing number. Conditional on Checking & Savings Accounts
          only; will not be returned otherwise.
        example: "122401710"
  Http400Response:
    properties:
      code:
        type: string
        example: invalidRequest
      type:
        type: string
        example: invalid
      moreInformation:
        type: string
        example: Missing or invalid parameters
  Http404Response:
    properties:
      httpCode:
        type: string
        example: "404"
      httpMessage:
        type: string
        example: Not Found
      moreInformation:
        type: string
        example: No resources match requested URI
  Http401Response:
    properties:
      code:
        type: string
        example: "401"
      type:
        type: string
        example: unAuthorized
      moreInformation:
        type: string
        example: Authorization credentials are missing or invalid
  AccountsGroupDetailsList:
    properties:
      accountGroupDetails:
        type: array
        description: Detailed list of every account group held by customer. accountGroupDetails
          is only applicable when the customer has more than one account
        items:
          $ref: '#/definitions/AccountGroupDetails'
      customer:
        $ref: '#/definitions/Customer'
  AccountGroupDetails:
    properties:
      accountGroup:
        type: string
        description: 'Account group is a classification of accounts according to their
          common characteristics. Values include: CHECKING, SAVINGS, CREDITCARD, LOAN,
          LINEOFCREDIT, BROKERAGE AND RETIREMENT'
        example: CHECKING
        enum:
        - CHECKING
        - SAVINGS
        - CREDITCARD
        - LOAN
        - LINEOFCREDIT
        - BROKERAGE
        - RETIREMENT
      checkingAccountsDetails:
        type: array
        description: List of Checking Accounts and the summary information which includes
          totalCurrentBalance and totalAvailableBalance
        items:
          $ref: '#/definitions/CheckingAccountDetailsList'
      savingsAccountsDetails:
        type: array
        description: List of Savings Accounts and the summary information which includes
          totalCurrentBalance and totalAvailableBalance
        items:
          $ref: '#/definitions/SavingsAccountDetailsList'
      creditCardAccountsDetails:
        type: array
        description: List of Credit Card Accounts and the summary information which
          includes totalCurrentBalance
        items:
          $ref: '#/definitions/CreditCardAccountDetailsList'
      loanAccountsDetails:
        type: array
        description: List of Loan Accounts details
        items:
          $ref: '#/definitions/LoanAccountDetailsList'
      lineOfCreditAccountsDetails:
        type: array
        description: List of Line of Credit and Checking Plus Accounts
        items:
          $ref: '#/definitions/LineOfCreditAccountDetailsList'
      brokerageAccountsDetails:
        type: array
        description: List of Brokerage Accounts Details
        items:
          $ref: '#/definitions/BrokerageAccountDetailsList'
      retirementAccountsDetails:
        type: array
        description: List of Retirement Accounts details
        items:
          $ref: '#/definitions/RetirementAccountDetailsList'
      totalCurrentBalance:
        $ref: '#/definitions/GroupBalance'
      totalAvailableBalance:
        $ref: '#/definitions/GroupBalance'
    required:
    - accountGroup
  CreditCardAccountDetailsList:
    required:
    - productName
    - displayAccountNumber
    - accountId
    - currencyCode
    - accountStatus
    - balanceType
    properties:
      productName:
        type: string
        description: Citi’s product name.
        example: Citi Rewards+℠ Card
      accountDescription:
        type: string
        description: Description of end customer's account indicating the product
          name and the last 4 digits of their account number.
        example: Citi Rewards+℠ Card - 7899
      balanceType:
        type: string
        description: Indicates the balance type for an account, whether it is an ASSET
          or a LIABILITY for the customer. Valid values include - ASSET (positive
          transaction amount increases balance), LIABILITY (positive transaction amount
          decreases balance)
        enum:
        - ASSET
        - LIABILITY
        example: LIABILITY
      displayAccountNumber:
        type: string
        description: A masked account number that can be displayed to the end customer
          to identify the account. Note - Should only show the last 4 digits of the
          account number, with the remaining numbers masked as "X"
        example: XXXXXXXXXXXX7899
      accountId:
        type: string
        description: Long-term persistent identity of the account. Not an account
          number.
        example: 8035a60debb671e89bd451c9ad0f283e8f1b8868dd4dc65520ceb7bdfeb4142999f574c9db37917ef0edfae296745142543e3ad2bc034887f37212ecbde83ee0
      currencyCode:
        type: string
        description: The currency code in ISO 4217 format.
        example: USD
      accountStatus:
        type: string
        description: The status of the account.
        enum:
        - ACTIVE
        - INACTIVE
        - CLOSED
        example: ACTIVE
      availableCredit:
        description: The amount of credit that is available to the end customer to
          use.
        type: number
        format: double
        example: 15000
      creditLimit:
        description: The maximum amount of credit extended to the customer for that
          account.
        type: number
        format: double
        example: 20000
      purchasesAPR:
        description: APR for credit card purchases.
        type: number
        format: double
        example: 23.450000
      minimumDueAmount:
        description: The minimum payment amount due at the payment due date for the
          current cycle.
        type: number
        format: double
        example: 1500
      paymentDueDate:
        description: The upcoming payment due date in YYYY-MM-DD format for the current
          cycle.
        type: string
        format: date
        example: "2017-03-27"
      currentBalance:
        description: For credit card accounts, this is the total balance owed on the
          credit account, including last statement balance and posted transactions
          since last statement less any payments or credits. This is the total balance
          on the account including delinquencies. This can be positive or negative
          values and up to 2 decimal places, e.g. 1, 1.01, -2.34.
        type: number
        format: double
        example: 10000.250000
      lastStatementBalance:
        description: Total amount  owed on the credit card up to the end of the most
          recent statement cycle.
        type: number
        format: double
        example: 5000.250000
      lastStatementDate:
        type: string
        format: date
        description: The date of the last credit card statement in ISO 8601 YYYY-MM-DD
          date format.
        example: "2019-02-27"
      advancesAPR:
        description: APR for cash advances.
        type: number
        format: double
        example: 23.450000
      cashAdvanceLimit:
        type: number
        format: double
        description: The maximum amount of cash advance extended to the customer for
          that account, which is taken as a percentage of credit limit to withdraw
          cash.
        example: 5000
      cashAdvanceAvailableAmount:
        type: number
        format: double
        description: Cash advance amount available.
        example: 2500
      lastPaymentAmount:
        type: number
        format: double
        description: The last credit card payment amount made.
        example: 1500.250000
      lastPaymentDate:
        type: string
        format: date
        description: The date of the last credit card payment in ISO 8601 YYYY-MM-DD
          date format.
        example: "2019-06-12"
      ctdPurchaseBalanceAmount:
        type: number
        format: double
        description: Current Spend Amount for Authorized User. Conditional on specific
          product types and/or spend limits; will not be returned otherwise.
        example: 300.250000
      purchaseSpendLimitAmount:
        type: number
        format: double
        description: Spend Limit assigned to Authorized User by Primary Account Owner.
          Conditional on specific product types and/or spend limits; will not be returned
          otherwise.
        example: 2000
      remainingPurchaseSpendAmount:
        type: number
        format: double
        description: Remaining Spend Amount for Authorized User. Conditional on specific
          product types and/or spend limits; will not be returned otherwise.
        example: 1699.750000
  CheckingAccountDetailsList:
    required:
    - productName
    - displayAccountNumber
    - accountId
    - currencyCode
    - accountStatus
    - balanceType
    properties:
      productName:
        type: string
        description: Citi’s product name.
        example: Business Checking
      accountNickname:
        type: string
        description: The nickname of the account assigned by the end customer.
        example: My checking account
      accountDescription:
        type: string
        description: Description of end customer's account indicating the product
          name and the last 4 digits of their account number.
        example: Business Checking - 9594
      balanceType:
        type: string
        description: Indicates the balance type for an account, whether it is an ASSET
          or a LIABILITY for the customer. Valid values include - ASSET (positive
          transaction amount increases balance), LIABILITY (positive transaction amount
          decreases balance).
        enum:
        - ASSET
        - LIABILITY
        example: ASSET
      displayAccountNumber:
        type: string
        description: A masked account number that can be displayed to the end customer
          to identify the account. Note - Should only show the last 4 digits of the
          account number, with the remaining numbers masked as "X".
        example: XXXXXX9594
      accountId:
        type: string
        description: Long-term persistent identity of the account. Not an account
          number.
        example: da549a7cc86472ee05272c7bd0a4483f57174f2110e7ad961a267995031fda66c6d5475de467a65739750107b621e5a01be7cc0dc085a825fa384795904293f6
      currencyCode:
        type: string
        description: The currency code in ISO 4217 format.
        example: USD
      accountStatus:
        type: string
        description: The status of the account.
        enum:
        - ACTIVE
        - INACTIVE
        - CLOSED
        example: ACTIVE
      currentBalance:
        description: For checking and saving accounts, this is the current balance
          of funds in the account including available balance and any pending or in
          progress deposits and withdrawals. May be referred to as ledger balance.
        type: number
        format: double
        example: 10000.250000
      availableBalance:
        description: The amount of funds available in the account to withdraw, deposit
          or transfer.
        type: number
        format: double
        example: 15000.250000
  SavingsAccountDetailsList:
    required:
    - productName
    - displayAccountNumber
    - accountId
    - currencyCode
    - accountStatus
    - balanceType
    properties:
      productName:
        type: string
        description: Citi’s product name.
        example: Citi Gold Savings Account
      accountNickname:
        type: string
        description: The nickname of the account assigned by the end customer.
        example: Personal Savings Account
      accountDescription:
        type: string
        description: Description of end customer's account indicating the product
          name and the last 4 digits of their account number.
        example: Citi Gold Savings Account - 2033
      balanceType:
        type: string
        description: Indicates the balance type for an account, whether it is an ASSET
          or a LIABILITY for the customer. Valid values include - ASSET (positive
          transaction amount increases balance), LIABILITY (positive transaction amount
          decreases balance)
        enum:
        - ASSET
        - LIABILITY
        example: ASSET
      displayAccountNumber:
        type: string
        description: A masked account number that can be displayed to the end customer
          to identify the account. Note - Should only show the last 4 digits of the
          account number, with the remaining numbers masked as "X".
        example: XXXXXX2033
      accountId:
        type: string
        description: Long-term persistent identity of the account. Not an account
          number.
        example: da549a7cc86472ee05272c7bd0a4483f57174f2110e7ad961a267995031fda66c6d5475de467a65739750107b621e5a01be7cc0dc085a825fa384795904293f6
      currencyCode:
        type: string
        description: The currency code in ISO 4217 format.
        example: USD
      accountStatus:
        type: string
        description: The status of the account.
        enum:
        - ACTIVE
        - INACTIVE
        - CLOSED
        example: ACTIVE
      currentBalance:
        description: For checking and saving accounts, this is the current balance
          of funds in the account including available balance and any pending or in
          progress deposits and withdrawals. May be referred to as ledger balance.
        type: number
        format: double
        example: 10000.250000
      availableBalance:
        description: The amount of funds available in the account to withdraw, deposit
          or transfer. Not applicable for CD accounts; will be present otherwise.
        type: number
        format: double
        example: 15000.250000
      maturityDate:
        type: string
        format: date
        description: Maturity Date in ISO 8601 YYYY-MM-DD format. Conditional on CD
          Accounts only; will not be present otherwise
        example: "2020-06-03"
      maturityTerm:
        type: string
        description: Maturity Term of the CD account. Conditional on CD Accounts only;
          will not be present otherwise.
        example: 2 years
  LoanAccountDetailsList:
    required:
    - productName
    - displayAccountNumber
    - accountId
    - currencyCode
    - balanceType
    properties:
      productName:
        type: string
        description: Citi’s product name.
        example: Personal Loan
      balanceType:
        type: string
        description: Indicates the balance type for an account, whether it is an ASSET
